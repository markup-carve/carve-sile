name: Pin drift

# Scheduled, not per pull request: "upstream moved" is not a failure of a pull
# request's change. test.yml checks the pins' local consistency on every PR.
# A drift verdict files a ticket and the run stays green; a broken check is red.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# One group across triggers: two reporters at once could file duplicate tickets.
concurrency:
  group: pin-drift-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pin-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Drift mode exits 3 on upstream drift alone; any other non-zero exit is
      # the check itself failing, and only that turns the run red.
      - name: Check the Dockerfile pins against upstream
        id: measure
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          verdict=clean
          for check in check-engine-pin.sh check-upstream-pins.sh; do
            rc=0
            ./scripts/$check drift >> /tmp/pin-drift.txt 2>&1 || rc=$?
            case "$rc" in
              0) ;;
              3) [ "$verdict" = broken ] || verdict=drift ;;
              *) verdict=broken; echo "::error::$check exited $rc, so it could not measure drift." ;;
            esac
          done
          cat /tmp/pin-drift.txt
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          {
            echo '## Dockerfile pins'
            echo
            echo '```text'
            cat /tmp/pin-drift.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$verdict" = broken ]; then exit 1; fi

      # One tracking issue, opened by the first drift verdict, edited by later
      # ones, closed by the first clean run. Fails if it cannot file.
      - name: File the verdict where someone reads it
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VERDICT: ${{ steps.measure.outputs.verdict }}
          HEAD_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "Pin drift tickets are scoped to $DEFAULT_BRANCH; $REF_NAME keeps its Actions verdict only."
            exit 0
          fi

          TITLE="The Dockerfile pins are behind upstream"
          MARKER="<!-- pin-drift-verdict ref=$REF_NAME -->"

          # Listed rather than searched: the search index lags a fresh issue.
          open_issues="$(gh api "repos/$REPO/issues?state=open&per_page=100" --paginate \
            | jq -r --arg m "$MARKER" \
                '.[] | select(.pull_request == null) | select((.body // "") | contains($m)) | .number')"
          issue="${open_issues%%$'\n'*}"

          case "${VERDICT:-}" in
            clean|drift) ;;
            *)
              echo "No verdict to file: the measure step failed, and the run stays red."
              exit 0
              ;;
          esac

          if [ "$VERDICT" = clean ]; then
            echo "The pins are current on $HEAD_SHA."
            if [ -n "$issue" ]; then
              gh issue comment "$issue" --repo "$REPO" --body \
                "Clean again: run $RUN_URL on \`$HEAD_SHA\`. Closing. The next drift verdict opens a fresh ticket rather than reopening this one."
              gh issue close "$issue" --repo "$REPO"
              echo "Closed #$issue."
            fi
            exit 0
          fi

          {
            echo "$MARKER"
            echo
            echo "The drift mode of \`scripts/check-engine-pin.sh\` or"
            echo "\`scripts/check-upstream-pins.sh\` reports that a Dockerfile pin on"
            echo "\`$DEFAULT_BRANCH\` no longer matches its upstream target."
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| run | $RUN_URL |"
            echo "| commit | \`$HEAD_SHA\` |"
            echo "| trigger | \`$EVENT_NAME\` |"
            echo
            echo "### What it reported"
            echo
            echo '```text'
            cat /tmp/pin-drift.txt
            echo '```'
            echo
            echo "### How to clear it"
            echo
            echo "Bump the pin the report names in the Dockerfile and open a pull request, or"
            echo "change the pin's row in \`scripts/upstream-pins.tsv\` if its target should"
            echo "change. Reproduce locally with \`./scripts/check-engine-pin.sh drift\` and"
            echo "\`./scripts/check-upstream-pins.sh drift\`."
            echo
            echo "This ticket is filed and maintained by the workflow. It is EDITED by each"
            echo "later drift verdict and CLOSED by the first clean run. Closing it by hand"
            echo "does not silence it: the next drift verdict files a new one."
          } > /tmp/pin-drift-verdict.md

          if [ -n "$issue" ]; then
            gh issue edit "$issue" --repo "$REPO" --body-file /tmp/pin-drift-verdict.md
            echo "Updated #$issue."
          else
            url="$(gh issue create --repo "$REPO" --title "$TITLE" \
              --body-file /tmp/pin-drift-verdict.md)"
            echo "Filed $url."
          fi
