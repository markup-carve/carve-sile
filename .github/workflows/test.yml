name: Test

on:
  push:
  pull_request:

# Every job below carries a timeout-minutes bound. Without one a job inherits
# GitHub's 360-minute default, and a stalled step can burn hours unnoticed.
jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and typeset smoke document
        run: ./test/container.sh

  engine-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check the Dockerfile engine pin against the newest release
        run: ./scripts/check-engine-pin.sh

  upstream-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check the Dockerfile source pins against their ruled targets
        run: ./scripts/check-upstream-pins.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
