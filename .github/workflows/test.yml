name: Test

on:
  push:
  pull_request:

# Every job below carries a timeout-minutes bound. Without one a job inherits
# GitHub's 360-minute default, and a stalled step can burn hours unnoticed.
jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and typeset smoke document
        run: ./test/container.sh

  engine-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # The comparison with the newest release runs in pin-drift.yml.
      - name: Check the Dockerfile engine pins agree with each other
        run: ./scripts/check-engine-pin.sh local

  upstream-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # The comparison with each upstream target runs in pin-drift.yml.
      - name: Check every Dockerfile source pin is ruled and the rockspec floor holds
        run: ./scripts/check-upstream-pins.sh local
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
